<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bankfreigabe · Cockpit</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#5d6675;--border:#e3e6eb;--primary:#2f5bd3;--red:#c0392b}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.b{max-width:560px;margin:10vh auto;padding:0 16px}
.c{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px}
h1{font-size:20px;margin:0 0 8px}p{color:var(--muted);margin:8px 0}
textarea{width:100%;box-sizing:border-box;height:96px;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:8px;resize:none}
button{margin-top:10px;background:var(--primary);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.err{color:var(--red)}
</style>
</head>
<body><div class="b"><div class="c" id="c"></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search),c=document.getElementById('c');
  if(q.get('error')){c.innerHTML='<h1 class="err">Freigabe nicht erteilt</h1><p></p><p>Starte im Terminal erneut: <code>python3 bank_abruf.py verbinden</code></p>';c.querySelector('p').textContent=q.get('error_description')||q.get('error');return;}
  if(!q.get('code')){c.innerHTML='<h1>Bankfreigabe</h1><p>Diese Seite nimmt die Rückmeldung der Bank für den automatischen Kontoabruf entgegen. Ohne Freigabe gibt es hier nichts zu tun.</p><p><a href="./">Zum Cockpit</a></p>';return;}
  c.innerHTML='<h1>Freigabe erteilt</h1><p>Kopiere diese Adresse und füge sie im Terminal ein, wo das Skript wartet.</p><textarea id="t" readonly></textarea><button id="k">Adresse kopieren</button><p id="ok"></p>';
  var t=document.getElementById('t');t.value=location.href;t.focus();t.select();
  document.getElementById('k').onclick=function(){t.select();(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(function(){document.getElementById('ok').textContent='Kopiert.';},function(){document.execCommand('copy');document.getElementById('ok').textContent='Kopiert.';});};
})();
</script>
</body>
</html>
